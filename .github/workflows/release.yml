name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Install frontend deps
        working-directory: frontend
        run: npm install

      - name: Build
        run: wails build -platform windows/amd64 -clean

      - name: Rename binary
        run: |
          move build\bin\winwatcher.exe build\bin\winwatcher-windows-amd64.exe

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: "winwatcher ${{ github.ref_name }}"
          draft: true
          generate_release_notes: false
          files: |
            build/bin/winwatcher-windows-amd64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}